<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="An explorable coastal village among meadows and woodland." />
  <title>Meadow Harbor</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#96b9c7}canvas{display:block;width:100%;height:100%;outline:none}
    #load{position:fixed;inset:0;display:grid;place-items:center;color:#f4f0db;font:14px Georgia,serif;letter-spacing:.15em;background:#40605f;transition:opacity .5s;pointer-events:none}
    #load::after{content:"";position:absolute;top:calc(50% + 27px);width:44px;height:1px;background:#f4f0db;animation:loading 1.8s ease-in-out infinite}@keyframes loading{0%,100%{transform:scaleX(.25);opacity:.25}50%{transform:scaleX(1);opacity:.8}}#load.done{opacity:0;visibility:hidden}#nav{position:fixed;right:18px;bottom:16px;display:flex;gap:7px;opacity:0;transition:opacity .3s}body:hover #nav,#nav:focus-within{opacity:.85}
    button{width:35px;height:35px;border:1px solid #ffffff45;border-radius:50%;background:#1726208a;color:#fff7df;font:18px Georgia;cursor:pointer;backdrop-filter:blur(7px)}button:hover{background:#172620d9}#hint{position:fixed;bottom:20px;left:20px;color:#fff5d6aa;font:12px system-ui;pointer-events:none;opacity:0;transition:opacity .3s}body:hover #hint{opacity:1}
    .clean #nav,.clean #hint{display:none}
  </style>
</head>
<body>
  <div id="load" role="status">MEADOW HARBOR</div>
  <div id="hint">Drag to explore &middot; Scroll to approach</div>
  <nav id="nav" aria-label="View controls"><button id="reset" title="Reference view (1)" aria-label="Reset to reference view">&#8962;</button><button id="travel" title="Explore (F)" aria-label="Toggle free camera" aria-pressed="false">&#8599;</button><button id="life" title="Pause villagers (V)" aria-label="Pause villagers" aria-pressed="false">&#9208;</button></nav>
  <script type="module" src="/main.js"></script>
</body>
</html>
