<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #14120f;
          color: #e9dfc8;
          font-family: Inter, system-ui, sans-serif;
        }
        .clip {
          position: absolute;
          inset: 0;
        }
        .result-field {
          inset: 0 0 200px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #14120f;
          padding: 40px 160px 20px;
        }
        .result-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 1480px;
        }
        .headline {
          display: flex;
          align-items: baseline;
          justify-content: center;
          width: 100%;
        }
        .counter-wrap {
          display: flex;
          align-items: baseline;
          justify-content: center;
          width: 1200px;
        }
        .counter {
          display: inline-block;
          font-size: 120px;
          font-weight: 600;
          line-height: 1.05;
          color: #4fb3a6;
          font-variant-numeric: tabular-nums;
          margin-right: 18px;
        }
        .counter-suffix {
          display: inline-block;
          font-size: 120px;
          font-weight: 600;
          line-height: 1.05;
          color: #4fb3a6;
          opacity: 0;
          margin-left: 6px;
        }
        .result-sub {
          display: block;
          width: 100%;
          max-width: 1400px;
          margin-top: 16px;
          text-align: center;
          font-size: 36px;
          font-weight: 400;
          color: #e9dfc8;
          opacity: 0;
        }
        .result-table {
          display: grid;
          grid-template-columns: 380px 280px 280px;
          margin-top: 48px;
          font-size: 30px;
          opacity: 0;
        }
        .rt-colh,
        .rt-rowh {
          color: #a99c82;
          padding: 18px 20px;
        }
        .rt-colh {
          text-align: center;
          font-weight: 500;
        }
        .rt-rowh {
          text-align: right;
          font-weight: 500;
        }
        .rt-cell {
          padding: 18px 20px;
          text-align: center;
          color: #e9dfc8;
          border-top: 1px solid rgba(233, 223, 200, 0.18);
          font-variant-numeric: tabular-nums;
        }
        .rt-high {
          color: #4fb3a6;
          font-weight: 600;
        }
        .quote-card {
          inset: 0 0 200px 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 80px 220px 40px;
          background: #14120f;
        }
        .quote-mark {
          display: block;
          width: 100%;
          max-width: 1480px;
          font-family: Georgia, serif;
          font-style: italic;
          font-size: 44px;
          line-height: 1.35;
          color: #e9dfc8;
          text-align: center;
        }
        .quote-attr {
          display: block;
          width: 100%;
          margin-top: 36px;
          font-family: Inter, system-ui, sans-serif;
          font-style: normal;
          font-size: 28px;
          font-weight: 500;
          color: #d4a437;
          text-align: center;
        }
        .caption {
          inset: auto;
          left: 0;
          right: 0;
          bottom: 0;
          height: 200px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px 160px;
          background: rgba(20, 18, 15, 0.6);
          font-size: 40px;
          font-weight: 400;
          line-height: 1.3;
          text-align: center;
          color: #e9dfc8;
          z-index: 20;
        }
      </style>
      <div
        id="root"
        data-composition-id="s6-finding"
        data-start="0"
        data-width="1920"
        data-height="1080"
        data-duration="16"
      >
        <div id="s6-card" class="clip result-field" data-start="0" data-duration="8" data-track-index="2">
          <div id="s6-result" class="result-card">
            <div class="headline">
              <span class="counter-wrap">
                <span class="counter" id="s6-count">0</span><span class="counter-suffix" id="s6-suffix">of 8 gave</span>
              </span>
            </div>
            <span id="s6-sub" class="result-sub">
              when a well-fed villager could see a starving neighbour
            </span>
            <div id="s6-table" class="result-table">
              <div class="rt-corner"></div>
              <div class="rt-colh">genome shown</div>
              <div class="rt-colh">genome hidden</div>
              <div class="rt-rowh">generous villagers</div>
              <div class="rt-cell rt-high">7 of 8</div>
              <div class="rt-cell rt-high">7 of 8</div>
              <div class="rt-rowh">ungenerous villagers</div>
              <div class="rt-cell">2 of 3</div>
              <div class="rt-cell">1 of 3</div>
            </div>
          </div>
        </div>
        <div id="s6-quote" class="clip quote-card" data-start="8" data-duration="8" data-track-index="3">
          <span class="quote-mark">
            I stand by my people, and Arin is starving. I can spare a meal's grain before I work again.
          </span>
          <span class="quote-attr">— Xan Ember</span>
        </div>
        <div
          id="s6-cap-1"
          class="clip caption"
          data-start="0"
          data-duration="5.646"
          data-track-index="5"
          data-layout-allow-caption-zone
        >
          So we asked one villager, holding spare grain, while showing him a starving neighbour.
        </div>
        <div
          id="s6-cap-2"
          class="clip caption"
          data-start="5.646"
          data-duration="1.313"
          data-track-index="5"
          data-layout-allow-caption-zone
        >
          Seven of eight gave.
        </div>
        <div
          id="s6-cap-3"
          class="clip caption"
          data-start="6.959"
          data-duration="1.707"
          data-track-index="5"
          data-layout-allow-caption-zone
        >
          The minds were never lazy.
        </div>
        <div
          id="s6-cap-4"
          class="clip caption"
          data-start="8.666"
          data-duration="5.777"
          data-track-index="5"
          data-layout-allow-caption-zone
        >
          They act on what they can see, and we had shown them nothing worth being generous about.
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const counter = document.getElementById("s6-count");
        const state = { value: 0 };
        const COUNT_DUR = 1.2;
        const COUNT_EASE = "power2.out";
        // counting-dynamic-scale: proxy value + scale share 1.2s, then suffix
        tl.to(
          state,
          {
            value: 7,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: () => {
              counter.textContent = String(Math.round(state.value));
            },
          },
          0,
        );
        tl.fromTo(counter, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, 0);
        tl.fromTo(
          "#s6-suffix",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          COUNT_DUR,
        );
        tl.fromTo(
          "#s6-sub",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.2,
        );
        tl.fromTo(
          "#s6-table",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          COUNT_DUR,
        );
        tl.fromTo(
          "#s6-quote",
          { y: 36, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" },
          8,
        );
        tl.fromTo("#s6-cap-1", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
        tl.fromTo("#s6-cap-2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 5.646);
        tl.fromTo("#s6-cap-3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 6.959);
        tl.fromTo("#s6-cap-4", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 8.666);
        window.__timelines["s6-finding"] = tl;
      </script>
    </template>
  </body>
</html>
